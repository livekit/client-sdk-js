# On demand: open an rc PR from the branch the workflow is run on. Merging
# it tags 2.25.0-rc.1 and publishes under the `next` dist-tag. Changesets
# stay pending for the final release.
name: Pre-release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the tags number the rc
      - uses: livekit/verwalter@359985c1e5567b17ae84db0241fbb305c383f89e # v0.30.0
        with:
          command: pre-release
          args: --target ${{ github.ref_name }}
          app-client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}
