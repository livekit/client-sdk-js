name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - name: Use Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: ESLint
      run: pnpm lint
    
    - name: Prettier
      run: pnpm format:check
    
    - name: Type check
      run: pnpm type:check

    - name: Throws check
      run: pnpm throws:check

    - name: Run Tests
      run: pnpm test

    - name: Check browser target compatibility
      run: |
        pnpm build:clean
        pnpm compat

    - name: Check published types in a consumer with skipLibCheck off
      run: pnpm check:published-types

    - name: Ensure package publish is configured correctly
      run: pnpm publint
